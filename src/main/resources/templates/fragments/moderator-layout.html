<!DOCTYPE html>

<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(pageTitle, activeMenu, content)">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:text="${pageTitle} + ' | Coworking Space'">
        Management | Coworking Space
    </title>

    <link rel="icon"
          type="image/x-icon"
          th:href="@{/favicon.ico}">

    <link rel="stylesheet"
          th:href="@{/css/moderator-layout.css}">

</head>

<body>

<div class="moderator-layout">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside id="moderatorSidebar"
           class="moderator-sidebar"
           aria-label="Điều hướng Management">

        <div class="sidebar-brand">

            <div class="brand-logo"
                 aria-hidden="true">
                C
            </div>

            <div class="brand-info">

                <span class="brand-title">
                    Coworking Space
                </span>

                <span class="brand-subtitle">
                    Management Panel
                </span>

            </div>

        </div>


        <nav class="sidebar-navigation">

            <div class="sidebar-section-title">
                Quản lý
            </div>


            <!-- USERS -->

            <a th:href="@{/moderator/users}"
               class="sidebar-link"
               th:classappend="${activeMenu == 'users'} ? ' active' : ''"
               th:attr="aria-current=${activeMenu == 'users'} ? 'page' : null">

                <span class="sidebar-icon"
                      aria-hidden="true">

                    <svg width="20"
                         height="20"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>

                        <circle cx="9"
                                cy="7"
                                r="4"/>

                        <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>

                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>

                    </svg>

                </span>

                <span>
                    Quản lý người dùng
                </span>

            </a>


            <!-- VENUES -->

            <a th:href="@{/moderator/venues}"
               class="sidebar-link"
               th:classappend="${activeMenu == 'venues'} ? ' active' : ''"
               th:attr="aria-current=${activeMenu == 'venues'} ? 'page' : null">

                <span class="sidebar-icon"
                      aria-hidden="true">

                    <svg width="20"
                         height="20"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <rect x="3"
                              y="3"
                              width="18"
                              height="18"
                              rx="2"/>

                        <path d="M9 21V9h6v12"/>

                        <path d="M9 5h.01"/>

                        <path d="M15 5h.01"/>

                    </svg>

                </span>

                <span>
                    Quản lý Venue
                </span>

            </a>


            <!-- BOOKINGS -->

            <a th:href="@{/moderator/bookings}"
               class="sidebar-link"
               th:classappend="${activeMenu == 'bookings'} ? ' active' : ''"
               th:attr="aria-current=${activeMenu == 'bookings'} ? 'page' : null">

                <span class="sidebar-icon"
                      aria-hidden="true">

                    <svg width="20"
                         height="20"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <rect x="3"
                              y="4"
                              width="18"
                              height="17"
                              rx="2"/>

                        <path d="M16 2v4"/>

                        <path d="M8 2v4"/>

                        <path d="M3 10h18"/>

                    </svg>

                </span>

                <span>
                    Quản lý Booking
                </span>

            </a>

            <div class="sidebar-admin-navigation"
                 sec:authorize="hasRole('ADMIN')">

                <div class="sidebar-section-title sidebar-admin-title">
                    Admin
                </div>

                <a th:href="@{/admin/statistics}"
                   class="sidebar-link"
                   th:classappend="${activeMenu == 'statistics'} ? ' active' : ''"
                   th:attr="aria-current=${activeMenu == 'statistics'} ? 'page' : null">
                    <span class="sidebar-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 3v18h18"/><path d="m7 16 4-5 4 3 5-7"/>
                        </svg>
                    </span>
                    <span>Thống kê hệ thống</span>
                </a>

                <a th:href="@{/admin/payments}"
                   class="sidebar-link"
                   th:classappend="${activeMenu == 'payments'} ? ' active' : ''"
                   th:attr="aria-current=${activeMenu == 'payments'} ? 'page' : null">
                    <span class="sidebar-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h2"/>
                        </svg>
                    </span>
                    <span>Lịch sử thanh toán</span>
                </a>

                <a th:href="@{/admin/roles}"
                   class="sidebar-link"
                   th:classappend="${activeMenu == 'roles'} ? ' active' : ''"
                   th:attr="aria-current=${activeMenu == 'roles'} ? 'page' : null">
                    <span class="sidebar-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3 4 7v5c0 5 3.4 8 8 9 4.6-1 8-4 8-9V7l-8-4Z"/><path d="M9 12h6M12 9v6"/>
                        </svg>
                    </span>
                    <span>Đổi role</span>
                </a>
            </div>

        </nav>


        <!-- =================================================
             SIDEBAR PROFILE
        ================================================== -->

        <div class="sidebar-footer">

            <div class="sidebar-profile">

                <span class="status-dot"
                      aria-hidden="true">
                </span>

                <div class="sidebar-profile-info">

                    <strong id="sidebarUserName">
                        Management Panel
                    </strong>

                    <span id="sidebarUserEmail">
                        Coworking Space
                    </span>

                </div>

            </div>

        </div>

    </aside>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <div class="moderator-main">

        <!-- =================================================
             TOPBAR
        ================================================== -->

        <header class="moderator-topbar">

            <div class="topbar-left">

                <button id="sidebarToggle"
                        class="sidebar-toggle"
                        type="button"
                        aria-label="Mở menu"
                        aria-controls="moderatorSidebar"
                        aria-expanded="false">

                    <svg width="21"
                         height="21"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         aria-hidden="true">

                        <path d="M4 6h16"/>

                        <path d="M4 12h16"/>

                        <path d="M4 18h16"/>

                    </svg>

                </button>


                <div class="topbar-heading">

                    <span id="topbarRoleLabel"
                          class="topbar-label">

                        Management

                    </span>

                    <h1 th:text="${pageTitle}">
                        Management
                    </h1>

                </div>

            </div>


            <div class="topbar-right">

                <span id="topbarRoleBadge"
                      class="role-badge">

                    Management

                </span>

                <button id="logoutButton"
                        type="button"
                        class="management-logout-button">

                    Đăng xuất

                </button>

            </div>

        </header>


        <!-- =================================================
             PAGE CONTENT
        ================================================== -->

        <main class="moderator-content">

            <div class="content-container">

                <div th:replace="${content}">
                </div>

            </div>

        </main>

    </div>

</div>


<!-- =========================================================
     SIDEBAR OVERLAY
========================================================= -->

<div id="sidebarOverlay"
     class="sidebar-overlay"
     aria-hidden="true">
</div>


<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            /* =================================================
               ELEMENTS
            ================================================= */

            const sidebar =
                document.getElementById(
                    "moderatorSidebar"
                );

            const toggle =
                document.getElementById(
                    "sidebarToggle"
                );

            const overlay =
                document.getElementById(
                    "sidebarOverlay"
                );

            const sidebarLinks =
                document.querySelectorAll(
                    ".sidebar-link"
                );


            /* =================================================
               SIDEBAR
            ================================================= */

            function openSidebar() {

                if (
                    !sidebar
                    ||
                    !overlay
                ) {

                    return;
                }


                sidebar.classList.add(
                    "open"
                );

                overlay.classList.add(
                    "visible"
                );

                overlay.setAttribute(
                    "aria-hidden",
                    "false"
                );

                document.body.style.overflow =
                    "hidden";


                if (toggle) {

                    toggle.setAttribute(
                        "aria-expanded",
                        "true"
                    );

                    toggle.setAttribute(
                        "aria-label",
                        "Đóng menu"
                    );
                }
            }


            function closeSidebar() {

                if (
                    !sidebar
                    ||
                    !overlay
                ) {

                    return;
                }


                sidebar.classList.remove(
                    "open"
                );

                overlay.classList.remove(
                    "visible"
                );

                overlay.setAttribute(
                    "aria-hidden",
                    "true"
                );

                document.body.style.overflow =
                    "";


                if (toggle) {

                    toggle.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                    toggle.setAttribute(
                        "aria-label",
                        "Mở menu"
                    );
                }
            }


            function toggleSidebar() {

                if (!sidebar) {

                    return;
                }


                if (
                    sidebar.classList.contains(
                        "open"
                    )
                ) {

                    closeSidebar();

                } else {

                    openSidebar();
                }
            }


            if (toggle) {

                toggle.addEventListener(
                    "click",
                    toggleSidebar
                );
            }


            if (overlay) {

                overlay.addEventListener(
                    "click",
                    closeSidebar
                );
            }


            sidebarLinks.forEach(
                function (link) {

                    link.addEventListener(
                        "click",
                        function () {

                            if (
                                window.innerWidth <= 900
                            ) {

                                closeSidebar();
                            }
                        }
                    );
                }
            );


            document.addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key === "Escape"
                        &&
                        sidebar
                        &&
                        sidebar.classList.contains(
                            "open"
                        )
                    ) {

                        closeSidebar();


                        if (toggle) {

                            toggle.focus();
                        }
                    }
                }
            );


            window.addEventListener(
                "resize",
                function () {

                    if (
                        window.innerWidth > 900
                    ) {

                        closeSidebar();
                    }
                }
            );


            /* =================================================
               CURRENT USER
            ================================================= */

            function getCurrentUser() {

                const rawUser =
                    sessionStorage.getItem(
                        "currentUser"
                    );


                if (!rawUser) {

                    return null;
                }


                try {

                    return JSON.parse(
                        rawUser
                    );

                } catch (error) {

                    console.error(
                        "[Management] Invalid currentUser:",
                        error
                    );


                    return null;
                }
            }


            function resolveRoleLabel(
                roles
            ) {

                if (
                    !Array.isArray(roles)
                ) {

                    return "Management";
                }


                if (
                    roles.includes(
                        "ADMIN"
                    )
                ) {

                    return "Admin";
                }


                if (
                    roles.includes(
                        "MODERATOR"
                    )
                ) {

                    return "Moderator";
                }


                return "Management";
            }


            const currentUser =
                getCurrentUser();


            if (currentUser) {

                const roleLabel =
                    resolveRoleLabel(
                        currentUser.roles
                    );


                const topbarRoleLabel =
                    document.getElementById(
                        "topbarRoleLabel"
                    );

                const topbarRoleBadge =
                    document.getElementById(
                        "topbarRoleBadge"
                    );

                const sidebarUserName =
                    document.getElementById(
                        "sidebarUserName"
                    );

                const sidebarUserEmail =
                    document.getElementById(
                        "sidebarUserEmail"
                    );


                if (topbarRoleLabel) {

                    topbarRoleLabel.textContent =
                        roleLabel;
                }


                if (topbarRoleBadge) {

                    topbarRoleBadge.textContent =
                        roleLabel;
                }


                if (
                    sidebarUserName
                    &&
                    currentUser.name
                ) {

                    sidebarUserName.textContent =
                        currentUser.name;
                }


                if (
                    sidebarUserEmail
                    &&
                    currentUser.email
                ) {

                    sidebarUserEmail.textContent =
                        currentUser.email;
                }
            }


            /* =================================================
               LOGOUT
            ================================================= */

            const logoutButton =
                document.getElementById(
                    "logoutButton"
                );


            async function logoutManagement() {

                const token =
                    sessionStorage.getItem(
                        "accessToken"
                    );


                try {

                    /*
                     * Nếu có accessToken thì gọi API logout
                     * để blacklist JWT.
                     */
                    if (token) {

                        await fetch(
                            "/api/auth/logout",
                            {
                                method:
                                    "POST",

                                credentials:
                                    "same-origin",

                                headers: {
                                    Authorization:
                                        `Bearer ${token}`
                                }
                            }
                        );
                    }


                } catch (error) {

                    /*
                     * Dù API logout lỗi,
                     * phía client vẫn phải clear session.
                     */
                    console.error(
                        "[Management] Logout failed:",
                        error
                    );


                } finally {

                    /*
                     * Xóa toàn bộ thông tin đăng nhập phía browser.
                     */
                    sessionStorage.removeItem(
                        "accessToken"
                    );

                    sessionStorage.removeItem(
                        "refreshToken"
                    );

                    sessionStorage.removeItem(
                        "currentUser"
                    );


                    /*
                     * Login giờ là login chung của hệ thống.
                     */
                    window.location.replace(
                        "/login"
                    );
                }
            }


            if (logoutButton) {

                logoutButton.addEventListener(
                    "click",
                    logoutManagement
                );
            }

        }
    );

</script>

</body>

</html>
